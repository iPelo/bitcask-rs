[package]
name = "bitcask-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A Bitcask-style persistent key-value store in Rust."
license = "MIT"

[[bin]]
name = "bitcask-server"
path = "src/bin/server.rs"

[[bin]]
name = "bitcask-cli"
path = "src/bin/client.rs"

[dev-dependencies]
proptest = "1"
