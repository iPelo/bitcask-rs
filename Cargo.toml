[package]
name = "bitcask-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Ilay Rakotondravao"]
description = "A Bitcask-style persistent key-value store in Rust."
license = "MIT"

[[bin]]
name = "bitcask-server"
path = "src/bin/server.rs"

[[bin]]
name = "bitcask-cli"
path = "src/bin/client.rs"

[dev-dependencies]
criterion = "0.7.0"
proptest = "1"

[[bench]]
name = "kv"
harness = false
